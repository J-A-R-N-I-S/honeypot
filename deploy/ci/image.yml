name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  ghcr:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        run: |
          set -euo pipefail
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          img="ghcr.io/${owner}/honeypot"
          tags="${img}:latest"
          tags="${tags}"$'\n'"${img}:${GITHUB_SHA::12}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tags="${tags}"$'\n'"${img}:${GITHUB_REF_NAME}"
          fi
          echo "img=${img}" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$tags" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          build-args: VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}

  # Customer SoT: Docker Hub (jarnis/honeypot). GHCR remains an internal CI artifact only.
  # Secrets cannot be referenced directly in job-level if:; use env intermediaries (GHA rule).
  # If credentials are missing: notice + skip publish steps; do not fail the workflow.
  hub:
    needs: test
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Check Docker Hub secrets
        id: creds
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Docker Hub::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set — skipping Hub publish (workflow continues; GHCR-only)"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.creds.outputs.present == 'true'
        uses: actions/checkout@v4

      - if: steps.creds.outputs.present == 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.creds.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - if: steps.creds.outputs.present == 'true'
        name: Tags
        id: meta
        run: |
          set -euo pipefail
          img="jarnis/honeypot"
          tags="${img}:latest"
          tags="${tags}"$'\n'"${img}:${GITHUB_SHA::12}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tags="${tags}"$'\n'"${img}:${GITHUB_REF_NAME}"
          fi
          echo "img=${img}" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$tags" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - if: steps.creds.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          build-args: VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
