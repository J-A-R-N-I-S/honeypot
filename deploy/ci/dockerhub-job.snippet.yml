# Append this job to .github/workflows/image.yml (same file as ghcr).
# Requires repo Actions secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.
# Job skips when either secret is empty (does not fail the workflow).

  dockerhub:
    needs: test
    if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tags
        id: meta
        run: |
          set -euo pipefail
          img="jarnis/honeypot"
          tags="${img}:latest"
          tags="${tags}"$'\n'"${img}:${GITHUB_SHA::12}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tags="${tags}"$'\n'"${img}:${GITHUB_REF_NAME}"
          fi
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$tags" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          build-args: VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
