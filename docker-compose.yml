# JARNIS capture-only honeypot — copy values from the app Install tab.
services:
  honeypot:
    image: ghcr.io/j-a-r-n-i-s/honeypot:latest
    build: .
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - hp-state:/var/lib/jarnis-honeypot
    environment:
      HONEYPOT_TOKEN: ${HONEYPOT_TOKEN}
      SSH_CONTAINER_PORT: "9022"
      TELNET_CONTAINER_PORT: "9023"
      HTTP_CONTAINER_PORT: "9080"
    ports:
      - "${SSH_HOST_PORT:-9022}:9022"
      - "${TELNET_HOST_PORT:-9023}:9023"
      - "${HTTP_HOST_PORT:-9080}:9080"

volumes:
  hp-state:
