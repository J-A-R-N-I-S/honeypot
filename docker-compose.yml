# JARNIS capture-only honeypot — copy values from the app Install tab.
services:
  honeypot:
    image: ghcr.io/j-a-r-n-i-s/honeypot:latest
    build: .
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - hp-state:/var/lib/jarnis-honeypot
    environment:
      HONEYPOT_TOKEN: ${HONEYPOT_TOKEN}
    ports:
      - "${SSH_HOST_PORT:-22}:22"
      - "${TELNET_HOST_PORT:-23}:23"
      - "${HTTP_HOST_PORT:-8080}:8080"

volumes:
  hp-state:
