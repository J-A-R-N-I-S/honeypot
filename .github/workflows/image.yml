# Copy over .github/workflows/image.yml (needs workflow-scope token / GitHub UI).
# After Hub push, updates deploy/release.json so the website Sensor veraltet
# tracker follows Docker Hub (VERSION=$GITHUB_SHA short id).
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "deploy/release.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  dockerhub:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tags
        id: meta
        run: |
          set -euo pipefail
          img="jarnis/honeypot"
          tags="${img}:latest"
          tags="${tags}"$'\n'"${img}:${GITHUB_SHA::12}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tags="${tags}"$'\n'"${img}:${GITHUB_REF_NAME}"
          fi
          echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$tags" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          build-args: VERSION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
      - name: Point deploy/release.json at published Hub build
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          SHORT: ${{ steps.meta.outputs.short }}
        run: |
          set -euo pipefail
          mkdir -p deploy
          python3 <<'PY'
          import json, os, pathlib
          from datetime import datetime, timezone
          short = os.environ["SHORT"]
          tags = [short, "v1.0-hostinger", "v1.0"]
          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/"):
              tags.insert(1, ref.split("/", 2)[-1])
          doc = {
              "version": short,
              "tags": tags,
              "source": "dockerhub",
              "image": "jarnis/honeypot:latest",
              "commit": os.environ["GITHUB_SHA"],
              "updated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          pathlib.Path("deploy/release.json").write_text(json.dumps(doc, indent=2) + "\n")
          PY
          git config user.name "jarnis-honeypot-ci"
          git config user.email "ci@jarnis.io"
          git add deploy/release.json
          if git diff --staged --quiet; then
            echo "release.json unchanged"
            exit 0
          fi
          git commit -m "chore: hub release ${SHORT} [skip ci]"
          git push
